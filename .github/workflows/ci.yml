# CI for nox.
#
# nox is one cargo workspace (`rs`, the library, and `cli`) with one Cargo.lock
# at the root. It depends on sibling crates through path deps (../../strata,
# ../../hemera, ../../lens, ../../honeycrisp), so every job lays out the same
# stand as the soft3 release train: nox, strata, hemera, lens and honeycrisp
# checked out side by side.
# The `lockfile` job resolves that stand and uploads the resulting Cargo.lock
# as an artifact so it can be committed.
# The `test` job runs `cargo test --locked` in `rs`, exactly the release
# train's `stack-nox` gate, then builds `cli`, then checks formatting last so a
# formatting nit cannot mask the gate's result.
# The `no_std` job runs AGENTS.md's no_std dependency gate: a library build for
# `thumbv7em-none-eabi` with no default features.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master, 'release/**']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # empty = strata's default branch
  STRATA_REF: ""
  # hemera's 0.4 line; set to main once hemera#25 (release/0.4 -> main) lands
  HEMERA_REF: release/0.4
  # lens's 0.2 line; set to master once lens#36 lands
  LENS_REF: release/0.2
  # empty = honeycrisp's default branch
  HONEYCRISP_REF: ""

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: nox
      - uses: actions/checkout@v4
        with:
          repository: cyberia-to/strata
          path: strata
          ref: ${{ env.STRATA_REF }}
      - uses: actions/checkout@v4
        with:
          repository: cyberia-to/hemera
          path: hemera
          ref: ${{ env.HEMERA_REF }}
      - uses: actions/checkout@v4
        with:
          repository: cyberia-to/lens
          path: lens
          ref: ${{ env.LENS_REF }}
      - uses: actions/checkout@v4
        with:
          repository: cyberia-to/honeycrisp
          path: honeycrisp
          ref: ${{ env.HONEYCRISP_REF }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: nox
      - name: resolve the stand
        run: cargo metadata --format-version 1 > /dev/null
        working-directory: nox
      - name: Cargo.lock changes
        run: git -C nox diff --stat -- Cargo.lock
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Cargo.lock
          path: nox/Cargo.lock
      - name: committed Cargo.lock matches the stand
        run: git -C nox diff --exit-code -- Cargo.lock

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: nox
      - uses: actions/checkout@v4
        with:
          repository: cyberia-to/strata
          path: strata
          ref: ${{ env.STRATA_REF }}
      - uses: actions/checkout@v4
        with:
          repository: cyberia-to/hemera
          path: hemera
          ref: ${{ env.HEMERA_REF }}
      - uses: actions/checkout@v4
        with:
          repository: cyberia-to/lens
          path: lens
          ref: ${{ env.LENS_REF }}
      - uses: actions/checkout@v4
        with:
          repository: cyberia-to/honeycrisp
          path: honeycrisp
          ref: ${{ env.HONEYCRISP_REF }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: nox
      - name: cargo test (rs)
        run: cargo test --locked
        working-directory: nox/rs
      - name: cargo build (cli)
        run: cargo build --locked
        working-directory: nox/cli
      # nox's own two packages only: `--all` would reach the sibling path
      # dependencies checked out beside us, whose formatting is their repos'.
      - name: cargo fmt --check
        run: cargo fmt -p cyber-nox -p nox-cli --check
        working-directory: nox

  no_std:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: nox
      - uses: actions/checkout@v4
        with:
          repository: cyberia-to/strata
          path: strata
          ref: ${{ env.STRATA_REF }}
      - uses: actions/checkout@v4
        with:
          repository: cyberia-to/hemera
          path: hemera
          ref: ${{ env.HEMERA_REF }}
      - uses: actions/checkout@v4
        with:
          repository: cyberia-to/lens
          path: lens
          ref: ${{ env.LENS_REF }}
      - uses: actions/checkout@v4
        with:
          repository: cyberia-to/honeycrisp
          path: honeycrisp
          ref: ${{ env.HONEYCRISP_REF }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabi
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: nox
      # AGENTS.md "no_std dependency gate": a missing target or dependency is a
      # red prerequisite, not a passed gate, so this job fails rather than skips.
      - name: cargo build (no_std, thumbv7em-none-eabi)
        run: cargo build -p cyber-nox --no-default-features --target thumbv7em-none-eabi --locked
        working-directory: nox
